name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch rather than burning minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck, build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Build
        run: npm run build

      - name: Test
        run: npm test --if-present -- --passWithNoTests

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Fails the build on high/critical advisories. Moderate and below are
      # reported but not blocking, so routine transitive noise doesn't stop
      # a deploy while real problems still do.
      - name: Audit dependencies
        run: npm audit --audit-level=high
